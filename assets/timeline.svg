<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><defs><linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36bcf7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1000" height="566" rx="16" fill="#0b1020"/><rect x="219" y="30" width="3" height="506" rx="1.5" fill="url(#l)" opacity="0.8"/><g><text x="190" y="36" text-anchor="end" font-size="14" fill="#36bcf7" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Jul 2025</text><circle cx="220.5" cy="30" r="9" fill="#0b1020" stroke="#36bcf7" stroke-width="3"/><circle cx="220.5" cy="30" r="3.5" fill="#36bcf7"/><text x="250" y="28" font-size="18" font-weight="700" fill="#e6eaf7">First AI tools</text><text x="250" y="52" font-size="14" fill="#8e97b8">Receipt and invoice processors that turn photos into import-ready data.</text></g><g><text x="190" y="114" text-anchor="end" font-size="14" fill="#a78bfa" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Aug – Sep 2025</text><circle cx="220.5" cy="108" r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="3"/><circle cx="220.5" cy="108" r="3.5" fill="#a78bfa"/><text x="250" y="106" font-size="18" font-weight="700" fill="#e6eaf7">Odoo web embeds</text><text x="250" y="130" font-size="14" fill="#8e97b8">A cake configurator built to live inside an Odoo website.</text></g><g><text x="190" y="192" text-anchor="end" font-size="14" fill="#34d399" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Oct 2025 – Jan 2026</text><circle cx="220.5" cy="186" r="9" fill="#0b1020" stroke="#34d399" stroke-width="3"/><circle cx="220.5" cy="186" r="3.5" fill="#34d399"/><text x="250" y="184" font-size="18" font-weight="700" fill="#e6eaf7">Multi-AI processor</text><text x="250" y="208" font-size="14" fill="#8e97b8">Database sync, auth, pharmacy-aware fuzzy matching and several AI providers.</text></g><g><text x="190" y="270" text-anchor="end" font-size="14" fill="#fbbf24" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Jul 2026</text><circle cx="220.5" cy="264" r="9" fill="#0b1020" stroke="#fbbf24" stroke-width="3"/><circle cx="220.5" cy="264" r="3.5" fill="#fbbf24"/><text x="250" y="262" font-size="18" font-weight="700" fill="#e6eaf7">Reporting automation</text><text x="250" y="286" font-size="14" fill="#8e97b8">ERP extraction, n8n pipelines and scheduled reports with self-healing.</text></g><g><text x="190" y="348" text-anchor="end" font-size="14" fill="#f472b6" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Aug – Sep 2026</text><circle cx="220.5" cy="342" r="9" fill="#0b1020" stroke="#f472b6" stroke-width="3"/><circle cx="220.5" cy="342" r="3.5" fill="#f472b6"/><text x="250" y="340" font-size="18" font-weight="700" fill="#e6eaf7">Analytics platform</text><text x="250" y="364" font-size="14" fill="#8e97b8">Role-based internal app, tax-invoice reconciliation, cost fixes.</text></g><g><text x="190" y="426" text-anchor="end" font-size="14" fill="#36bcf7" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Sep 2026</text><circle cx="220.5" cy="420" r="9" fill="#0b1020" stroke="#36bcf7" stroke-width="3"/><circle cx="220.5" cy="420" r="3.5" fill="#36bcf7"/><text x="250" y="418" font-size="18" font-weight="700" fill="#e6eaf7">Trading research</text><text x="250" y="442" font-size="14" fill="#8e97b8">ICT charting app and MT5 strategy tooling.</text></g><g><text x="190" y="504" text-anchor="end" font-size="14" fill="#a78bfa" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Oct – Nov 2026</text><circle cx="220.5" cy="498" r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="3"/><circle cx="220.5" cy="498" r="3.5" fill="#a78bfa"/><text x="250" y="496" font-size="18" font-weight="700" fill="#e6eaf7">Till &amp; bank bridge</text><text x="250" y="520" font-size="14" fill="#8e97b8">Kiosk till, bank notifications, reconciliation and a live rollout.</text></g></svg>