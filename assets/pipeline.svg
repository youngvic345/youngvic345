acity="0.55"/><text x="210.5" y="185" text-anchor="middle" font-size="12" fill="#a78bfa" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Postgres</text><rect x="257" y="172" width="55" height="22" rx="11" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/><text x="284.5" y="185" text-anchor="middle" font-size="12" fill="#a78bfa" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Excel</text></svg>